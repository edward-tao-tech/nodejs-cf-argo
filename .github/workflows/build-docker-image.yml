name: Publish to Docker Hub

on:
  push:
    branches:
      - main # 如果你的主分支叫 master，请修改此处
    tags:
      - 'v*' # 当你推送 v1.0.0 这种版本标签时也会触发发布

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 自动打上 latest 和具体的 commit hash 标签
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/nodejs-cf-argo:latest
            ${{ secrets.DOCKER_USERNAME }}/nodejs-cf-argo:${{ github.sha }}
